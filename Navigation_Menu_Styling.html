<title>WT Lab — Task 8</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f6f8fb;color:#111827}
header{background:#0b63d8;padding:10px 20px;box-shadow:0 3px 8px rgba(0,0,0,.1)}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:20px;align-items:center}
nav a{text-decoration:none;color:#fff;font-weight:600;transition:.3s;padding:8px 10px;border-radius:6px;display:block}
nav a:hover{background:rgba(255,255,255,.2)}
nav a.active{background:#fff;color:#0b63d8}
.dropdown{position:relative}
.dropdown ul{display:none;position:absolute;top:100%;left:0;background:#fff;color:#111827;min-width:160px;border-radius:6px;box-shadow:0 8px 16px rgba(0,0,0,.1);padding:10px 0;flex-direction:column}
.dropdown ul li a{color:#111827;padding:8px 14px}
.dropdown:hover ul{display:flex}
.vertical-nav{width:200px;background:#fff;border-right:1px solid #e5e7eb;padding:15px;margin:20px auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.vertical-nav a{color:#0b63d8;display:block;padding:8px 10px;border-radius:6px;margin-bottom:5px;text-decoration:none;transition:.3s}
.vertical-nav a:hover{background:#e0e7ff}
@media(max-width:600px){nav ul{flex-direction:column;align-items:flex-start}}
</style>
</head>

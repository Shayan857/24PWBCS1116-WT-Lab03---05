<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WT Lab — Task 7</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:20px;background:#f6f8fb;color:#111827}
.container{max-width:1000px;margin:auto;background:#fff;border-radius:8px;padding:25px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
h1{text-align:center;color:#0b63d8;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;border:1px solid #e6e6e6;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.08);overflow:hidden;transition:all .3s ease}
.card:hover{transform:translateY(-6px);box-shadow:0 10px 25px rgba(0,0,0,.12)}
.card img{width:100%;height:160px;object-fit:cover}
.card-body{padding:15px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:18px;margin:0;color:#0b63d8}
.card p{font-size:14px;color:#374151;margin:0}
.card button{padding:8px 14px;background:linear-gradient(180deg,#0b63d8,#094ca8);border:none;border-radius:6px;color:#fff;cursor:pointer;font-weight:600;transition:.3s}
.card button:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(11,99,216,.25)}
</style>
</head>
<body>
<div class="container">
<h1>Card Component Design</h1>
<div class="cards">
<div class="card">
<img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=400" alt="Laptop">
<div class="card-body">
<h2>Laptop Pro</h2>
<p>High-performance laptop for students and professionals.</p>
<button>Buy Now</button>
</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1503602642458-232111445657?w=400" alt="Headphones">
<div class="card-body">
<h2>Wireless Headphones</h2>
<p>Noise-cancelling sound with deep bass and comfort.</p>
<button>Shop Now</button>
</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1481277542470-605612bd2d61?w=400" alt="Camera">
<div class="card-body">
<h2>HD Camera</h2>
<p>Capture your world in stunning clarity with 4K resolution.</p>
<button>Learn More</button>
</div>
</div>
</div>
</div>
</body>
</html>

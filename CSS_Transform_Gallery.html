<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WT Lab — Task 9</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:20px;background:#f6f8fb;color:#111827;text-align:center}
.container{max-width:1000px;margin:auto;background:#fff;border-radius:8px;padding:25px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
h1{color:#0b63d8;margin-bottom:20px}
.gallery{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-top:20px}
.box{width:150px;height:150px;background:#0b63d8;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;border-radius:10px;transition:transform .5s,background .3s}
.rotate:hover{transform:rotate(45deg);background:#1d4ed8}
.scale:hover{transform:scale(1.3);background:#10b981}
.translate:hover{transform:translateX(40px);background:#f59e0b}
.skew:hover{transform:skew(20deg,10deg);background:#dc2626}
.combined:hover{transform:rotate(20deg) scale(1.2) translateY(-20px);background:#8b5cf6}
.threed:hover{transform:rotateY(180deg);background:#0ea5e9;transform-style:preserve-3d}
.origin{transform-origin:top left}
.origin:hover{transform:rotate(45deg);background:#14b8a6}
</style>
</head>
<body>
<div class="container">
<h1>CSS Transform Gallery</h1>
<div class="gallery">
<div class="box rotate">Rotate</div>
<div class="box scale">Scale</div>
<div class="box translate">Translate</div>
<div class="box skew">Skew</div>
<div class="box combined">Combined</div>
<div class="box threed">3D Flip</div>
<div class="box origin">Origin</div>
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WT Lab — Task 12</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:20px;background:#f6f8fb;color:#111827}
.container{max-width:900px;margin:auto;background:#fff;border-radius:8px;padding:25px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
h1{text-align:center;color:#0b63d8;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #e5e7eb}
th{background:#0b63d8;color:#fff}
tr:nth-child(even){background:#f9fafb}
tr:hover{background:#e0e7ff;transition:.3s}
.core{color:#0b63d8;font-weight:600}
.elective{color:#10b981;font-weight:600}
.lab{color:#f59e0b;font-weight:600}
@media(max-width:700px){
table,thead,tbody,th,td,tr{display:block;width:100%}
th{display:none}
td{border:none;position:relative;padding-left:50%}
td::before{position:absolute;left:15px;width:45%;white-space:nowrap;font-weight:600;color:#374151}
td:nth-of-type(1)::before{content:"Course Code"}
td:nth-of-type(2)::before{content:"Course Name"}
td:nth-of-type(3)::before{content:"Type"}
td:nth-of-type(4)::before{content:"Credits"}
}
</style>
</head>
<body>
<div class="container">
<h1>Course Schedule</h1>
<table>
<thead>
<tr><th>Course Code</th><th>Course Name</th><th>Type</th><th>Credits</th></tr>
</thead>
<tbody>
<tr><td>CS101</td><td>Introduction to Programming</td><td class="core">Core</td><td>3</td></tr>
<tr><td>CS202</td><td>Data Structures</td><td class="core">Core</td><td>3</td></tr>
<tr><td>CS303</td><td>Web Technologies</td><td class="lab">Lab</td><td>1</td></tr>
<tr><td>CS404</td><td>Artificial Intelligence</td><td class="elective">Elective</td><td>3</td></tr>
<tr><td>CS405</td><td>Cybersecurity</td><td class="elective">Elective</td><td>3</td></tr>
<tr><td>CS406</td><td>Database Systems</td><td class="core">Core</td><td>3</td></tr>
</tbody>
</table>
</div>
</body>
</html>
